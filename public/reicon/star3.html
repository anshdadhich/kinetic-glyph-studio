<title>Star 3 - wiggle icon</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111; font: 14px system-ui, sans-serif; }
  main { display: grid; justify-items: center; gap: 16px; }
  svg { width: 96px; height: 96px; display: block; cursor: pointer; overflow: visible; }
  p { color: #737373; margin: 0; font-size: 12px; }

<body>
<main>

<g><path d="M11.9238 8.79907L11.5662 8.59536C11.1733 8.37161 10.9769 8.25973 10.8431 8.07305C10.7094 7.88637 10.6535 7.646 10.5416 7.16529L10.4398 6.72764C10.0462 5.03598 9.84944 4.19015 9.28291 4.02582M11.9238 8.79907C13.3063 9.58645 13.9975 9.98014 14.0217 10.6404C14.0459 11.3006 13.3871 11.7902 12.0695 12.7693L11.7286 13.0226C11.3541 13.3008 11.1669 13.4399 11.0475 13.6446M11.9238 8.79907L19.5438 10.9095M9.79155 17.8917C10.3431 17.648 10.477 16.7787 10.7447 15.0401L10.814 14.5903C10.8901 14.0962 10.9281 13.8492 11.0475 13.6446M9.79155 17.8917C9.79155 17.8917 8.63602 17.5922 7.42809 16.5056L7.11558 16.2245C6.77232 15.9157 6.6007 15.7614 6.39316 15.7012C6.18564 15.641 5.96568 15.6818 5.52582 15.7634L5.12535 15.8376C3.57742 16.1248 2.80345 16.2683 2.43835 15.7587C2.07325 15.2491 2.3588 14.4238 2.92992 12.7732L3.07767 12.3462C3.23996 11.8771 3.32111 11.6426 3.31224 11.4007C3.30337 11.1589 3.20548 10.937 3.00971 10.4934L2.83147 10.0895C2.14254 8.52837 1.79807 7.7478 2.12399 7.18912C2.4499 6.63044 3.23035 6.66365 4.79126 6.73007L5.19508 6.74725C5.63864 6.76613 5.86042 6.77556 6.06247 6.68628C6.26452 6.59701 6.42396 6.41912 6.74284 6.06335L7.03315 5.73945C8.1553 4.48747 8.71638 3.86148 9.28291 4.02582M9.79155 17.8917L16.3385 19.7908C17.0321 19.9921 17.379 20.0927 17.7377 19.8866C18.0965 19.6806 18.1952 19.3721 18.3925 18.7553C18.5205 18.3555 18.6408 17.8839 18.7224 17.3542L18.7916 16.9044C18.8677 16.4104 18.9058 16.1633 19.0251 15.9587M11.0475 13.6446L19.0251 15.9587M9.28291 4.02582L17.2605 6.33995C17.8271 6.50429 18.0239 7.35012 18.4174 9.04178L18.5193 9.47943C18.6311 9.96015 18.687 10.2005 18.8208 10.3872C18.9545 10.5739 19.1509 10.6857 19.5438 10.9095M19.5438 10.9095L19.9014 11.1132C21.2839 11.9006 21.9751 12.2943 21.9994 12.9545C22.0236 13.6148 21.3647 14.1043 20.0471 15.0834L19.7062 15.3367C19.3318 15.6149 19.1445 15.754 19.0251 15.9587" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.5" data-part="part-1" data-pivot="12 12"/></   </svg>
  <p>Hover or click to play. First gesture unlocks sound.</p>
</main>
<script>
// Star 3: The shape swells and relaxes like a gentle confirmation. Motion: soft-pop.
const MOTION = {"kind":"soft-pop","transform":"scale","rotate":0,"scale":1.18,"fade":0.7,"duration":560,"stagger":45};
// Sound: A rounded two-note chime.
const SOUND = {"wave":"sine","base":666,"end":853,"noise":0.008,"decay":0.2};
const svg = document.querySelector('svg');
const parts = Array.from(svg.querySelectorAll('[data-part]'));
let ctx;

function unlock() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function playSound() {
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = SOUND.wave;
  osc.frequency.setValueAtTime(SOUND.base, t);
  osc.frequency.exponentialRampToValueAtTime(SOUND.end, t + SOUND.decay);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(0.12, t + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + SOUND.decay);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + SOUND.decay + 0.03);
  if (SOUND.noise > 0) {
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.06), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * SOUND.noise;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const ng = ctx.createGain();
    src.buffer = buf;
    filter.type = 'bandpass';
    filter.frequency.value = SOUND.base * 2;
    ng.gain.setValueAtTime(1, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    src.connect(filter).connect(ng).connect(ctx.destination);
    src.start(t);
  }
}

function keyframes(i) {
  const far = i % 2 === 0 ? 1 : -1;
  if (MOTION.transform === 'rotate') return [
    { transform: 'rotate(0deg) scale(1)', opacity: 1 },
    { transform: 'rotate(' + (MOTION.rotate * far) + 'deg) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.45 },
    { transform: 'rotate(0deg) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translateY') return [
    { transform: 'translateY(0) scale(1)', opacity: 1 },
    { transform: 'translateY(' + (3 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'translateY(0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translate') return [
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: 'translate(' + (2.4 * far) + 'px,' + (-1.4 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'translate(0,0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'scaleY') return [
    { transform: 'scaleY(1)', opacity: 1 },
    { transform: 'scaleY(' + (2 - MOTION.scale) + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'scaleY(1)', opacity: 1 }
  ];
  return [
    { transform: 'scale(1)', opacity: 1 },
    { transform: 'scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'scale(1)', opacity: 1 }
  ];
}

function animate() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  parts.forEach((part, i) => {
    part.animate(keyframes(i), {
      duration: MOTION.duration,
      delay: i * MOTION.stagger,
      easing: 'cubic-bezier(0.2, 1.25, 0.3, 1)',
      fill: 'both'
    });
  });
}

function play() { unlock(); playSound(); animate(); }
svg.addEventListener('mouseenter', play);
svg.addEventListener('click', play);
</script>
