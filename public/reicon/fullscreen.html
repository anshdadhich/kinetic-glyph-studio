<!doctype html>
<html lang="en">
<head>

<title>Fullscreen - wiggle icon</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111; font: 14px system-ui, sans-serif; }
  main { display: grid; justify-items: center; gap: 16px; }
  svg { width: 96px; height: 96px; display: block; cursor: pointer; overflow: visible; }
  p { color: #737373; margin: 0; font-size: 12px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Fullscreen">
<g><path fill-rule="evenodd" clip-rule="evenodd" d="M9.94358 1.25L10 1.25C10.4142 1.25 10.75 1.58579 10.75 2C10.75 2.41421 10.4142 2.75 10 2.75C8.09318 2.75 6.73851 2.75159 5.71085 2.88976C4.70476 3.02502 4.12511 3.27869 3.7019 3.7019C3.27869 4.12511 3.02502 4.70476 2.88976 5.71085C2.75159 6.73851 2.75 8.09318 2.75 10C2.75 10.4142 2.41421 10.75 2 10.75C1.58579 10.75 1.25 10.4142 1.25 10L1.25 9.94358C1.24998 8.10582 1.24997 6.65019 1.40314 5.51098C1.56076 4.33856 1.89288 3.38961 2.64124 2.64124C3.38961 1.89288 4.33856 1.56076 5.51098 1.40314C6.65019 1.24997 8.10582 1.24998 9.94358 1.25ZM18.2892 2.88976C17.2615 2.75159 15.9068 2.75 14 2.75C13.5858 2.75 13.25 2.41421 13.25 2C13.25 1.58579 13.5858 1.25 14 1.25L14.0564 1.25C15.8942 1.24998 17.3498 1.24997 18.489 1.40314C19.6614 1.56076 20.6104 1.89288 21.3588 2.64124C22.1071 3.38961 22.4392 4.33856 22.5969 5.51098C22.75 6.65019 22.75 8.10583 22.75 9.94359V10C22.75 10.4142 22.4142 10.75 22 10.75C21.5858 10.75 21.25 10.4142 21.25 10C21.25 8.09318 21.2484 6.73851 21.1102 5.71085C20.975 4.70476 20.7213 4.12511 20.2981 3.7019C19.8749 3.27869 19.2952 3.02502 18.2892 2.88976ZM2 13.25C2.41421 13.25 2.75 13.5858 2.75 14C2.75 15.9068 2.75159 17.2615 2.88976 18.2892C3.02502 19.2952 3.27869 19.8749 3.7019 20.2981C4.12511 20.7213 4.70476 20.975 5.71085 21.1102C6.73851 21.2484 8.09318 21.25 10 21.25C10.4142 21.25 10.75 21.5858 10.75 22C10.75 22.4142 10.4142 22.75 10 22.75H9.94359C8.10583 22.75 6.65019 22.75 5.51098 22.5969C4.33856 22.4392 3.38961 22.1071 2.64124 21.3588C1.89288 20.6104 1.56076 19.6614 1.40314 18.489C1.24997 17.3498 1.24998 15.8942 1.25 14.0564L1.25 14C1.25 13.5858 1.58579 13.25 2 13.25ZM22 13.25C22.4142 13.25 22.75 13.5858 22.75 14V14.0564C22.75 15.8942 22.75 17.3498 22.5969 18.489C22.4392 19.6614 22.1071 20.6104 21.3588 21.3588C20.6104 22.1071 19.6614 22.4392 18.489 22.5969C17.3498 22.75 15.8942 22.75 14.0564 22.75H14C13.5858 22.75 13.25 22.4142 13.25 22C13.25 21.5858 13.5858 21.25 14 21.25C15.9068 21.25 17.2615 21.2   </svg>
  <p>Hover or click to play. First gesture unlocks sound.</p>
</main>
<script>
// Fullscreen: Each drawn part settles with a short spring and a light overshoot. Motion: part-spring.
const MOTION = {"kind":"part-spring","transform":"translate","rotate":5.95,"scale":1.1,"fade":0.6,"duration":620,"stagger":45};
// Sound: A soft synthetic click with a rounded tonal body.
const SOUND = {"wave":"triangle","base":397,"end":539,"noise":0.025,"decay":0.16};
const svg = document.querySelector('svg');
const parts = Array.from(svg.querySelectorAll('[data-part]'));
let ctx;

function unlock() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function playSound() {
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = SOUND.wave;
  osc.frequency.setValueAtTime(SOUND.base, t);
  osc.frequency.exponentialRampToValueAtTime(SOUND.end, t + SOUND.decay);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(0.12, t + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + SOUND.decay);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + SOUND.decay + 0.03);
  if (SOUND.noise > 0) {
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.06), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * SOUND.noise;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const ng = ctx.createGain();
    src.buffer = buf;
    filter.type = 'bandpass';
    filter.frequency.value = SOUND.base * 2;
    ng.gain.setValueAtTime(1, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    src.connect(filter).connect(ng).connect(ctx.destination);
    src.start(t);
  }
}

function keyframes(i) {
  const far = i % 2 === 0 ? 1 : -1;
  if (MOTION.transform === 'rotate') return [
    { transform: 'rotate(0deg) scale(1)', opacity: 1 },
    { transform: 'rotate(' + (MOTION.rotate * far) + 'deg) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.45 },
    { transform: 'rotate(0deg) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translateY') return [
    { transform: 'translateY(0) scale(1)', opacity: 1 },
    { transform: 'translateY(' + (3 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'translateY(0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translate') return [
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: 'translate(' + (2.4 * far) + 'px,' + (-1.4 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'translate(0,0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'scaleY') return [
    { transform: 'scaleY(1)', opacity: 1 },
    { transform: 'scaleY(' + (2 - MOTION.scale) + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'scaleY(1)', opacity: 1 }
  ];
  return [
    { transform: 'scale(1)', opacity: 1 },
    { transform: 'scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'scale(1)', opacity: 1 }
  ];
}

function animate() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  parts.forEach((part, i) => {
    part.animate(keyframes(i), {
      duration: MOTION.duration,
      delay: i * MOTION.stagger,
      easing: 'cubic-bezier(0.2, 1.25, 0.3, 1)',
      fill: 'both'
    });
  });
}

function play() { unlock(); playSound(); animate(); }
svg.addEventListener('mouseenter', play);
svg.addEventListener('click', play);
</script>
