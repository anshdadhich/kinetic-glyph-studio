<!doctype html>
<html lang="en">
<head>

<title>Tower - wiggle icon</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111; font: 14px system-ui, sans-serif; }
  main { display: grid; justify-items: center; gap: 16px; }
  svg { width: 96px; height: 96px; display: block; cursor: pointer; overflow: visible; }
  p { color: #737373; margin: 0; font-size: 12px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Tower">
<g><path d="M5.52491 2.53385C3.79459 4.24127 2.75 6.51346 2.75 8.99907C2.75 11.4855 3.7953 13.7584 5.52666 15.466C5.82156 15.7569 5.82484 16.2317 5.53398 16.5267C5.24312 16.8216 4.76825 16.8248 4.47334 16.534C2.48164 14.5696 1.25 11.9213 1.25 8.99907C1.25 6.07782 2.48081 3.43034 4.47134 1.46615C4.76617 1.17521 5.24104 1.17838 5.53197 1.47321C5.82291 1.76805 5.81975 2.24291 5.52491 2.53385Z" fill="currentColor" data-part="part-1" data-pivot="12 12"/><path d="M18.4751 2.53385C20.2054 4.24127 21.25 6.51346 21.25 8.99907C21.25 11.4855 20.2047 13.7584 18.4733 15.466C18.1784 15.7569 18.1752 16.2317 18.466 16.5267C18.7569 16.8216 19.2317 16.8248 19.5267 16.534C21.5184 14.5696 22.75 11.9213 22.75 8.99907C22.75 6.07782 21.5192 3.43034 19.5287 1.46615C19.2338 1.17521 18.759 1.17838 18.468 1.47321C18.1771 1.76805 18.1803 2.24291 18.4751 2.53385Z" fill="currentColor" data-part="part-2" data-pivot="12 12"/><path fill-rule="evenodd" clip-rule="evenodd" d="M12.75 11.122C13.6239 10.8131 14.25 9.97966 14.25 9C14.25 7.75736 13.2426 6.75 12 6.75C10.7574 6.75 9.75 7.75736 9.75 9C9.75 9.97966 10.3761 10.8131 11.25 11.122V22C11.25 22.4142 11.5858 22.75 12 22.75C12.4142 22.75 12.75 22.4142 12.75 22V11.122ZM12 8.25C11.5858 8.25 11.25 8.58579 11.25 9C11.25 9.41421 11.5858 9.75 12 9.75C12.4142 9.75 12.75 9.41421 12.75 9C12.75 8.58579 12.4142 8.25 12 8.25Z" fill="currentColor" data-part="part-3" data-pivot="12 12"/><path d="M16.7451 9C16.7451 7.8525 16.2647 6.80706 15.4727 6.0381C15.1755 5.74956 15.1685 5.27474 15.457 4.97755C15.7456 4.68037 16.2204 4.67336 16.5176 4.9619C17.5809 5.99429 18.2451 7.42044 18.2451 9C18.2451 10.5796 17.5809 12.0057 16.5176 13.0381C16.2204 13.3266 15.7456 13.3196 15.457 13.0224C15.1685 12.7253 15.1755 12.2504 15.4727 11.9619C16.2647 11.1929 16.7451 10.1475 16.7451 9Z" fill="currentColor" data-part="part-4" data-pivot="12 12"/><path d="M7.25488 9C7.25488 7.8525 7.73533 6.80706 8.52733 6.0381C8.82451 5.74956 8.83152 5.27474 8.54298 4.97755C8.25444 4.68037 7.77962 4.   </svg>
  <p>Hover or click to play. First gesture unlocks sound.</p>
</main>
<script>
// Tower: Structures and bars rise from their base and settle, as if being assembled. Motion: rise-and-settle.
const MOTION = {"kind":"rise-and-settle","transform":"translateY","rotate":0,"scale":1.05,"fade":0.5,"duration":720,"stagger":55};
// Sound: A soft thud with a short tonal body.
const SOUND = {"wave":"sine","base":221,"end":301,"noise":0.035,"decay":0.18};
const svg = document.querySelector('svg');
const parts = Array.from(svg.querySelectorAll('[data-part]'));
let ctx;

function unlock() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function playSound() {
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = SOUND.wave;
  osc.frequency.setValueAtTime(SOUND.base, t);
  osc.frequency.exponentialRampToValueAtTime(SOUND.end, t + SOUND.decay);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(0.12, t + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + SOUND.decay);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + SOUND.decay + 0.03);
  if (SOUND.noise > 0) {
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.06), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * SOUND.noise;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const ng = ctx.createGain();
    src.buffer = buf;
    filter.type = 'bandpass';
    filter.frequency.value = SOUND.base * 2;
    ng.gain.setValueAtTime(1, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    src.connect(filter).connect(ng).connect(ctx.destination);
    src.start(t);
  }
}

function keyframes(i) {
  const far = i % 2 === 0 ? 1 : -1;
  if (MOTION.transform === 'rotate') return [
    { transform: 'rotate(0deg) scale(1)', opacity: 1 },
    { transform: 'rotate(' + (MOTION.rotate * far) + 'deg) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.45 },
    { transform: 'rotate(0deg) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translateY') return [
    { transform: 'translateY(0) scale(1)', opacity: 1 },
    { transform: 'translateY(' + (3 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'translateY(0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translate') return [
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: 'translate(' + (2.4 * far) + 'px,' + (-1.4 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'translate(0,0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'scaleY') return [
    { transform: 'scaleY(1)', opacity: 1 },
    { transform: 'scaleY(' + (2 - MOTION.scale) + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'scaleY(1)', opacity: 1 }
  ];
  return [
    { transform: 'scale(1)', opacity: 1 },
    { transform: 'scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'scale(1)', opacity: 1 }
  ];
}

function animate() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  parts.forEach((part, i) => {
    part.animate(keyframes(i), {
      duration: MOTION.duration,
      delay: i * MOTION.stagger,
      easing: 'cubic-bezier(0.2, 1.25, 0.3, 1)',
      fill: 'both'
    });
  });
}

function play() { unlock(); playSound(); animate(); }
svg.addEventListener('mouseenter', play);
svg.addEventListener('click', play);
</script>
</body>
</html>
