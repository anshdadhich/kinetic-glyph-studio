<!doctype html>
<html lang="en">
<head>

<title>Earbuds - wiggle icon</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111; font: 14px system-ui, sans-serif; }
  main { display: grid; justify-items: center; gap: 16px; }
  svg { width: 96px; height: 96px; display: block; cursor: pointer; overflow: visible; }
  p { color: #737373; margin: 0; font-size: 12px; }

<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Earbuds">
<g><path fill-rule="evenodd" clip-rule="evenodd" d="M5.16581 2.25L5.21275 2.25C5.4789 2.24999 5.64093 2.24999 5.78214 2.25693C8.73594 2.40204 11.098 4.76407 11.2431 7.71786C11.25 7.85907 11.25 8.0211 11.25 8.28723V18.75C11.25 20.4069 9.90686 21.75 8.25 21.75C6.59315 21.75 5.25 20.4069 5.25 18.75V12.3C5.25 12.1619 5.13807 12.05 5 12.05C2.92893 12.05 1.25 10.3711 1.25 8.3L1.25 6.16581C1.24999 6.01259 1.24998 5.90829 1.25452 5.816C1.34916 3.88961 2.88961 2.34916 4.816 2.25452C4.90829 2.24998 5.01259 2.24999 5.16581 2.25ZM5.1875 3.75C5.0045 3.75 4.94013 3.75023 4.8896 3.75271C3.73377 3.80949 2.80949 4.73377 2.75271 5.8896C2.75023 5.94013 2.75 6.0045 2.75 6.1875V8.3C2.75 9.54264 3.75736 10.55 5 10.55C5.9665 10.55 6.75 11.3335 6.75 12.3V17.25H9.75V8.3125C9.75 8.01343 9.74977 7.89103 9.74488 7.79146C9.63763 5.60822 7.89178 3.86238 5.70854 3.75512C5.60897 3.75023 5.48657 3.75 5.1875 3.75ZM9.75 18.75H6.75C6.75 19.5784 7.42157 20.25 8.25 20.25C9.07843 20.25 9.75 19.5784 9.75 18.75ZM19.1104 3.75271C19.0599 3.75023 18.9955 3.75 18.8125 3.75C18.5134 3.75 18.391 3.75023 18.2915 3.75512C16.1082 3.86238 14.3624 5.60822 14.2551 7.79146C14.2502 7.89103 14.25 8.01343 14.25 8.3125V17.25H17.25V12.3C17.25 11.3335 18.0335 10.55 19 10.55C20.2426 10.55 21.25 9.54264 21.25 8.3V6.1875C21.25 6.00449 21.2498 5.94013 21.2473 5.8896C21.1905 4.73377 20.2662 3.80949 19.1104 3.75271ZM17.25 18.75H14.25C14.25 19.5784 14.9216 20.25 15.75 20.25C16.5784 20.25 17.25 19.5784 17.25 18.75ZM18.8342 2.25C18.9874 2.24999 19.0917 2.24998 19.184 2.25452C21.1104 2.34916 22.6508 3.88961 22.7455 5.816C22.75 5.90827 22.75 6.01255 22.75 6.16571V8.3C22.75 10.3711 21.0711 12.05 19 12.05C18.8619 12.05 18.75 12.1619 18.75 12.3V18.75C18.75 20.4069 17.4069 21.75 15.75 21.75C14.0931 21.75 12.75 20.4069 12.75 18.75V8.28723C12.75 8.0211 12.75 7.85907 12.7569 7.71786C12.902 4.76407 15.2641 2.40204 18.2179 2.25693C18.3591 2.24999 18.5211 2.24999 18.7873 2.25L18.8342 2.25ZM4.5 5.25C4.91422 5.25 5.25 5.58579 5.25 6V8.5C5.25 8.9142   </svg>
  <p>Hover or click to play. First gesture unlocks sound.</p>
</main>
<script>
// Earbuds: The buds bob in their case and pulse like a tiny driver starting up. Motion: bob-and-pulse.
const MOTION = {"kind":"bob-and-pulse","transform":"translateY","rotate":0,"scale":1.12,"fade":0.6,"duration":680,"stagger":60};
// Sound: A clean tick pair with a small chime.
const SOUND = {"wave":"sine","base":772,"end":1016,"noise":0.015,"decay":0.14};
const svg = document.querySelector('svg');
const parts = Array.from(svg.querySelectorAll('[data-part]'));
let ctx;

function unlock() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function playSound() {
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = SOUND.wave;
  osc.frequency.setValueAtTime(SOUND.base, t);
  osc.frequency.exponentialRampToValueAtTime(SOUND.end, t + SOUND.decay);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(0.12, t + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + SOUND.decay);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + SOUND.decay + 0.03);
  if (SOUND.noise > 0) {
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.06), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * SOUND.noise;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const ng = ctx.createGain();
    src.buffer = buf;
    filter.type = 'bandpass';
    filter.frequency.value = SOUND.base * 2;
    ng.gain.setValueAtTime(1, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    src.connect(filter).connect(ng).connect(ctx.destination);
    src.start(t);
  }
}

function keyframes(i) {
  const far = i % 2 === 0 ? 1 : -1;
  if (MOTION.transform === 'rotate') return [
    { transform: 'rotate(0deg) scale(1)', opacity: 1 },
    { transform: 'rotate(' + (MOTION.rotate * far) + 'deg) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.45 },
    { transform: 'rotate(0deg) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translateY') return [
    { transform: 'translateY(0) scale(1)', opacity: 1 },
    { transform: 'translateY(' + (3 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'translateY(0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translate') return [
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: 'translate(' + (2.4 * far) + 'px,' + (-1.4 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'translate(0,0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'scaleY') return [
    { transform: 'scaleY(1)', opacity: 1 },
    { transform: 'scaleY(' + (2 - MOTION.scale) + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'scaleY(1)', opacity: 1 }
  ];
  return [
    { transform: 'scale(1)', opacity: 1 },
    { transform: 'scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'scale(1)', opacity: 1 }
  ];
}

function animate() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  parts.forEach((part, i) => {
    part.animate(keyframes(i), {
      duration: MOTION.duration,
      delay: i * MOTION.stagger,
      easing: 'cubic-bezier(0.2, 1.25, 0.3, 1)',
      fill: 'both'
    });
  });
}

function play() { unlock(); playSound(); animate(); }
svg.addEventListener('mouseenter', play);
svg.addEventListener('click', play);
</script>
