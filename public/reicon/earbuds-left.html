<!doctype html>
<html lang="en">

<title>Earbuds Left - wiggle icon</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111; font: 14px system-ui, sans-serif; }
  main { display: grid; justify-items: center; gap: 16px; }
  svg { width: 96px; height: 96px; display: block; cursor: pointer; overflow: visible; }
  p { color: #737373; margin: 0; font-size: 12px; }

</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Earbuds Left">
<g><path fill-rule="evenodd" clip-rule="evenodd" d="M7.62585 1.25L7.66826 1.25005C9.91768 1.26167 11.7383 3.08232 11.7499 5.33174L11.75 5.33476L11.75 5.37415L11.75 8C11.75 10.0711 10.0711 11.75 8 11.75C7.86193 11.75 7.75 11.8619 7.75 12V19.5C7.75 21.2949 6.29493 22.75 4.5 22.75C2.70507 22.75 1.25 21.2949 1.25 19.5L1.25008 7.55549C1.26803 4.08057 4.08057 1.26804 7.55548 1.25009L7.55851 1.25008L7.62585 1.25ZM7.56324 2.75007C7.56275 2.75007 7.56227 2.75007 7.56179 2.75007C4.91039 2.76455 2.76455 4.9104 2.75007 7.56179C2.75007 7.56227 2.75007 7.56275 2.75006 7.56324L2.75 7.625V17.9167H6.25V12C6.25 11.0335 7.0335 10.25 8 10.25C9.24264 10.25 10.25 9.24264 10.25 8L10.25 5.37586L10.25 5.33949C10.25 5.33909 10.25 5.33869 10.25 5.33828C10.2419 3.91226 9.08792 2.75817 7.66193 2.75004C7.66146 2.75004 7.66098 2.75004 7.66051 2.75004L7.62585 2.75H7.62415L7.56324 2.75007ZM6.25 19.4167H2.75V19.5C2.75 20.4665 3.5335 21.25 4.5 21.25C5.4665 21.25 6.25 20.4665 6.25 19.5V19.4167ZM8 4.25C8.41421 4.25 8.75 4.58579 8.75 5V8C8.75 8.41422 8.41421 8.75 8 8.75C7.58579 8.75 7.25 8.41422 7.25 8V5C7.25 4.58579 7.58579 4.25 8 4.25ZM13.2658 4.95082C13.3482 4.54489 13.7441 4.28261 14.15 4.36501C16.4043 4.82261 18.1782 6.59648 18.6358 8.8508C18.7182 9.25674 18.4559 9.65261 18.05 9.73501C17.6441 9.81741 17.2482 9.55514 17.1658 9.1492C16.828 7.48526 15.5156 6.17279 13.8516 5.83503C13.4457 5.75263 13.1834 5.35676 13.2658 4.95082ZM9.25 16.5C9.25 13.0482 12.0482 10.25 15.5 10.25C18.9518 10.25 21.75 13.0482 21.75 16.5C21.75 19.9518 18.9518 22.75 15.5 22.75C12.0482 22.75 9.25 19.9518 9.25 16.5ZM15.5 11.75C12.8766 11.75 10.75 13.8766 10.75 16.5C10.75 19.1234 12.8766 21.25 15.5 21.25C18.1234 21.25 20.25 19.1234 20.25 16.5C20.25 13.8766 18.1234 11.75 15.5 11.75ZM14 13.25C14.4142 13.25 14.75 13.5858 14.75 14V18.25H17C17.4142 18.25 17.75 18.5858 17.75 19C17.75 19.4142 17.4142 19.75 17 19.75H14C13.5858 19.75 13.25 19.4142 13.25 19V14C13.25 13.5858 13.5858 13.25 14 13.25Z" fill="currentColor" data-part="part-1" da   </svg>
  <p>Hover or click to play. First gesture unlocks sound.</p>
</main>
<script>
// Earbuds Left: The buds bob in their case and pulse like a tiny driver starting up. Motion: bob-and-pulse.
const MOTION = {"kind":"bob-and-pulse","transform":"translateY","rotate":0,"scale":1.12,"fade":0.6,"duration":680,"stagger":60};
// Sound: A clean tick pair with a small chime.
const SOUND = {"wave":"sine","base":740,"end":1000,"noise":0.015,"decay":0.14};
const svg = document.querySelector('svg');
const parts = Array.from(svg.querySelectorAll('[data-part]'));
let ctx;

function unlock() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function playSound() {
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = SOUND.wave;
  osc.frequency.setValueAtTime(SOUND.base, t);
  osc.frequency.exponentialRampToValueAtTime(SOUND.end, t + SOUND.decay);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(0.12, t + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + SOUND.decay);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + SOUND.decay + 0.03);
  if (SOUND.noise > 0) {
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.06), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * SOUND.noise;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const ng = ctx.createGain();
    src.buffer = buf;
    filter.type = 'bandpass';
    filter.frequency.value = SOUND.base * 2;
    ng.gain.setValueAtTime(1, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    src.connect(filter).connect(ng).connect(ctx.destination);
    src.start(t);
  }
}

function keyframes(i) {
  const far = i % 2 === 0 ? 1 : -1;
  if (MOTION.transform === 'rotate') return [
    { transform: 'rotate(0deg) scale(1)', opacity: 1 },
    { transform: 'rotate(' + (MOTION.rotate * far) + 'deg) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.45 },
    { transform: 'rotate(0deg) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translateY') return [
    { transform: 'translateY(0) scale(1)', opacity: 1 },
    { transform: 'translateY(' + (3 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'translateY(0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translate') return [
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: 'translate(' + (2.4 * far) + 'px,' + (-1.4 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'translate(0,0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'scaleY') return [
    { transform: 'scaleY(1)', opacity: 1 },
    { transform: 'scaleY(' + (2 - MOTION.scale) + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'scaleY(1)', opacity: 1 }
  ];
  return [
    { transform: 'scale(1)', opacity: 1 },
    { transform: 'scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'scale(1)', opacity: 1 }
  ];
}

function animate() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  parts.forEach((part, i) => {
    part.animate(keyframes(i), {
      duration: MOTION.duration,
      delay: i * MOTION.stagger,
      easing: 'cubic-bezier(0.2, 1.25, 0.3, 1)',
      fill: 'both'
    });
  });
}

function play() { unlock(); playSound(); animate(); }
svg.addEventListener('mouseenter', play);
svg.addEventListener('click', play);
</script>
