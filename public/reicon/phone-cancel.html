<body>

<g><path fill-rule="evenodd" clip-rule="evenodd" d="M8.98569 3.47641C7.9721 2.04283 5.94388 1.80096 4.7177 3.0919L3.1481 4.7444C2.61224 5.30855 2.20497 6.09224 2.25401 7.00591C2.35326 8.85513 3.13844 12.64 7.27161 16.9915C11.701 21.6548 15.9261 21.8893 17.75 21.7092C18.497 21.6355 19.1016 21.2371 19.545 20.7703L20.9655 19.2747C22.2705 17.9008 21.8904 15.6016 20.2575 14.6617L18.347 13.5621C17.2485 12.9298 15.8862 13.111 15.0124 14.031L14.6038 14.4612C14.5748 14.4714 14.484 14.4959 14.3103 14.4677C13.9078 14.4023 13.0391 14.0469 11.607 12.5392C10.1793 11.0361 9.82765 10.1104 9.7609 9.65489C9.7287 9.43513 9.76142 9.31935 9.77436 9.28299L9.7765 9.27719L10.0214 9.0194C10.9889 8.00073 11.0574 6.40656 10.2467 5.25989L8.98569 3.47641ZM5.80528 4.12493C6.32812 3.57449 7.24855 3.61773 7.7609 4.34237L9.02189 6.12586C9.44403 6.72292 9.3793 7.51731 8.93376 7.98637L8.64695 8.28834L9.17861 8.79333C8.64694 8.28835 8.64625 8.28907 8.64556 8.2898L8.64415 8.2913L8.64125 8.29441L8.63514 8.30104L8.62182 8.31603C8.61246 8.32678 8.60219 8.33909 8.5912 8.35298C8.56922 8.38075 8.54435 8.41489 8.51826 8.45566C8.46594 8.53742 8.40921 8.64508 8.36116 8.78011C8.26346 9.05468 8.21022 9.41827 8.27675 9.87234C8.40746 10.7645 8.99202 11.9642 10.5194 13.5722C12.0422 15.1755 13.1924 15.8058 14.0699 15.9483C14.5201 16.0214 14.8846 15.963 15.1606 15.8541C15.2955 15.8009 15.4023 15.7384 15.4824 15.6816C15.5223 15.6533 15.5556 15.6264 15.5825 15.6028C15.5959 15.591 15.6078 15.5801 15.6181 15.5701L15.6324 15.556L15.6388 15.5495L15.6417 15.5464L15.6432 15.545C15.6438 15.5442 15.6445 15.5435 15.1174 15.0428L15.6446 15.5435L16.1 15.064C16.4854 14.6582 17.086 14.567 17.5987 14.8621L19.5092 15.9618C20.3301 16.4342 20.4907 17.5965 19.8779 18.2417L18.4574 19.7373C18.1783 20.031 17.8864 20.1885 17.6026 20.2165C16.1676 20.3581 12.4234 20.2373 8.35919 15.9584C4.48307 11.8776 3.83289 8.43533 3.75185 6.92552C3.73042 6.52621 3.90429 6.12632 4.23568 5.77743L5.80528 4.12493Z" fill="currentColor" data-part="part-1" data-p   <p>Hover or click to play. First gesture unlocks sound.</p>

<script>
// Phone Cancel: A handset vibrates on its ring axis, the way a ringing device moves on a table. Motion: ring-shake.
const MOTION = {"kind":"ring-shake","transform":"rotate","rotate":11.85,"scale":1.05,"fade":0.7,"duration":540,"stagger":35};
// Sound: A two-tone telephone ring with a short buzz.
const SOUND = {"wave":"square","base":674,"end":717,"noise":0.02,"decay":0.22};
const svg = document.querySelector('svg');
const parts = Array.from(svg.querySelectorAll('[data-part]'));
let ctx;

function unlock() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function playSound() {
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = SOUND.wave;
  osc.frequency.setValueAtTime(SOUND.base, t);
  osc.frequency.exponentialRampToValueAtTime(SOUND.end, t + SOUND.decay);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(0.12, t + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + SOUND.decay);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + SOUND.decay + 0.03);
  if (SOUND.noise > 0) {
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.06), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * SOUND.noise;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const ng = ctx.createGain();
    src.buffer = buf;
    filter.type = 'bandpass';
    filter.frequency.value = SOUND.base * 2;
    ng.gain.setValueAtTime(1, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    src.connect(filter).connect(ng).connect(ctx.destination);
    src.start(t);
  }
}

function keyframes(i) {
  const far = i % 2 === 0 ? 1 : -1;
  if (MOTION.transform === 'rotate') return [
    { transform: 'rotate(0deg) scale(1)', opacity: 1 },
    { transform: 'rotate(' + (MOTION.rotate * far) + 'deg) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.45 },
    { transform: 'rotate(0deg) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translateY') return [
    { transform: 'translateY(0) scale(1)', opacity: 1 },
    { transform: 'translateY(' + (3 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'translateY(0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translate') return [
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: 'translate(' + (2.4 * far) + 'px,' + (-1.4 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'translate(0,0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'scaleY') return [
    { transform: 'scaleY(1)', opacity: 1 },
    { transform: 'scaleY(' + (2 - MOTION.scale) + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'scaleY(1)', opacity: 1 }
  ];
  return [
    { transform: 'scale(1)', opacity: 1 },
    { transform: 'scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'scale(1)', opacity: 1 }
  ];
}

function animate() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  parts.forEach((part, i) => {
    part.animate(keyframes(i), {
      duration: MOTION.duration,
      delay: i * MOTION.stagger,
      easing: 'cubic-bezier(0.2, 1.25, 0.3, 1)',
      fill: 'both'
    });
  });
}

function play() { unlock(); playSound(); animate(); }
svg.addEventListener('mouseenter', play);
svg.addEventListener('click', play);
</script>

</html>
