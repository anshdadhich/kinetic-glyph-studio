<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone End - wiggle icon</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111; font: 14px system-ui, sans-serif; }
  main { display: grid; justify-items: center; gap: 16px; }
  svg { width: 96px; height: 96px; display: block; cursor: pointer; overflow: visible; }
  p { color: #737373; margin: 0; font-size: 12px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Phone End">
<g><path fill-rule="evenodd" clip-rule="evenodd" d="M12 7.75C6.51318 7.75 3.90179 10.2012 3.01834 11.2674C2.84345 11.4785 2.75 11.7741 2.75 12.1414L2.75 14.0643C2.75 14.8281 3.5319 15.4412 4.36905 15.1959L6.36905 14.6097C6.90669 14.4522 7.25 13.9833 7.25 13.4782L7.25 12.8617L8 12.8617C7.25 12.8617 7.25 12.8607 7.25 12.8597L7.25001 12.8576L7.25004 12.8534L7.25019 12.8444L7.25085 12.8245C7.25147 12.8104 7.25248 12.7946 7.25406 12.7773C7.25722 12.7426 7.26263 12.7016 7.27167 12.6552C7.2898 12.5622 7.32239 12.4484 7.37982 12.3222C7.49703 12.0645 7.7059 11.7811 8.05672 11.524C8.74267 11.0214 9.93056 10.6463 12 10.6463C14.0694 10.6463 15.2573 11.0214 15.9433 11.524C16.2941 11.7811 16.503 12.0645 16.6202 12.3222C16.6776 12.4484 16.7102 12.5622 16.7283 12.6552C16.7374 12.7016 16.7428 12.7426 16.7459 12.7773C16.7475 12.7946 16.7485 12.8104 16.7492 12.8245L16.7498 12.8444L16.75 12.8534L16.75 12.8576L16.75 12.8597C16.75 12.8607 16.75 12.8617 16 12.8617H16.75V13.25C16.75 13.8157 17.1811 14.3284 17.8091 14.4204L19.8091 14.7135C20.5953 14.8287 21.25 14.2406 21.25 13.5429V11.4183C21.25 10.9778 21.1133 10.632 20.8708 10.4154C19.8648 9.51708 17.233 7.75 12 7.75ZM15.25 12.9335V13.25C15.25 14.5971 16.2642 15.71 17.5916 15.9046L19.5916 16.1977C21.2257 16.4371 22.75 15.2128 22.75 13.5429V11.4183C22.75 10.6848 22.5191 9.87638 21.8699 9.29661C20.5944 8.15756 17.6087 6.25 12 6.25C5.98964 6.25 2.97874 8.96419 1.86331 10.3104C1.40595 10.8624 1.25 11.5309 1.25 12.1414L1.25 14.0643C1.25 15.8966 3.05932 17.1428 4.7909 16.6353L6.7909 16.0492C7.93988 15.7125 8.75 14.6777 8.75 13.4782L8.75 12.9335C8.76534 12.9044 8.8133 12.8292 8.94328 12.734C9.25733 12.5039 10.0694 12.1463 12 12.1463C13.9306 12.1463 14.7427 12.5039 15.0567 12.734C15.1867 12.8292 15.2347 12.9044 15.25 12.9335Z" fill="currentColor" data-part="part-1" data-pivot="12 12"/></g>
  </svg>
  <p>Hover or click to play. First gesture unlocks sound.</p>
</main>
<script>
// Phone End: A handset vibrates on its ring axis, the way a ringing device moves on a table. Motion: ring-shake.
const MOTION = {"kind":"ring-shake","transform":"rotate","rotate":9.2,"scale":1.05,"fade":0.7,"duration":540,"stagger":35};
// Sound: A two-tone telephone ring with a short buzz.
const SOUND = {"wave":"square","base":568,"end":664,"noise":0.02,"decay":0.22};
const svg = document.querySelector('svg');
const parts = Array.from(svg.querySelectorAll('[data-part]'));
let ctx;

function unlock() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function playSound() {
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = SOUND.wave;
  osc.frequency.setValueAtTime(SOUND.base, t);
  osc.frequency.exponentialRampToValueAtTime(SOUND.end, t + SOUND.decay);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(0.12, t + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + SOUND.decay);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + SOUND.decay + 0.03);
  if (SOUND.noise > 0) {
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.06), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * SOUND.noise;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const ng = ctx.createGain();
    src.buffer = buf;
    filter.type = 'bandpass';
    filter.frequency.value = SOUND.base * 2;
    ng.gain.setValueAtTime(1, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    src.connect(filter).connect(ng).connect(ctx.destination);
    src.start(t);
  }
}

function keyframes(i) {
  const far = i % 2 === 0 ? 1 : -1;
  if (MOTION.transform === 'rotate') return [
    { transform: 'rotate(0deg) scale(1)', opacity: 1 },
    { transform: 'rotate(' + (MOTION.rotate * far) + 'deg) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.45 },
    { transform: 'rotate(0deg) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translateY') return [
    { transform: 'translateY(0) scale(1)', opacity: 1 },
    { transform: 'translateY(' + (3 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'translateY(0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'translate') return [
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: 'translate(' + (2.4 * far) + 'px,' + (-1.4 * far) + 'px) scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'translate(0,0) scale(1)', opacity: 1 }
  ];
  if (MOTION.transform === 'scaleY') return [
    { transform: 'scaleY(1)', opacity: 1 },
    { transform: 'scaleY(' + (2 - MOTION.scale) + ')', opacity: MOTION.fade, offset: 0.4 },
    { transform: 'scaleY(1)', opacity: 1 }
  ];
  return [
    { transform: 'scale(1)', opacity: 1 },
    { transform: 'scale(' + MOTION.scale + ')', opacity: MOTION.fade, offset: 0.42 },
    { transform: 'scale(1)', opacity: 1 }
  ];
}

function animate() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  parts.forEach((part, i) => {
    part.animate(keyframes(i), {
      duration: MOTION.duration,
      delay: i * MOTION.stagger,
      easing: 'cubic-bezier(0.2, 1.25, 0.3, 1)',
      fill: 'both'
    });
  });
}

function play() { unlock(); playSound(); animate(); }
svg.addEventListener('mouseenter', play);
svg.addEventListener('click', play);
</script>
</body>
</html>
